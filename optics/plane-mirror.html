<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>平面鏡成像｜互動光學實驗室</title><link rel="stylesheet" href="optics.css"></head><body data-mode="plane"><div class="shell"><header><a class="brand" href="index.html"><span class="brand-mark">◉</span><span>互動光學實驗室</span></a><nav class="nav"><a href="index.html">實驗首頁</a><a class="active" href="plane-mirror.html">平面鏡</a><a href="concave-mirror.html">凹面鏡</a><a href="convex-mirror.html">凸面鏡</a><a href="reflection-law.html">反射定律</a><a href="refraction-law.html">折射定律</a><a href="convex-lens.html">凸透鏡</a><a href="concave-lens.html">凹透鏡</a></nav><button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" title="切換為暗黑模式">☾ 暗黑模式</button></header><div class="eyebrow">PLANE MIRROR</div><h1>平面鏡成像</h1><p class="subtitle">調整物距與物高，觀察鏡像如何與物體對稱。</p><main class="layout"><section class="stage"><div class="stage-top"><span>光線示意圖</span><div class="legend"><span><i class="dot object"></i>物體</span><span><i class="dot image"></i>虛像</span><span><i class="dot ray"></i>光線</span></div></div><canvas aria-label="平面鏡光線成像示意圖"></canvas><span class="canvas-hint">拖曳紅色物體調整物距；拖曳物體頂端調整物高</span></section><aside class="panel" id="controls"></aside></main><section class="intro-card"><span class="intro-icon">✦</span><div><strong>觀察重點</strong><p>圖中以平行主軸的水平光線表示反射：光線垂直入射平面鏡後沿原路返回，鏡後虛線是反射光的反向延長線。物距等於像距，像與物等高、等大，因此形成虛像。</p></div></section></div><script src="theme.js"></script><script src="optics.js"></script></body></html>
